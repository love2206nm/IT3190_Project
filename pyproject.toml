[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "it3190-sentiment-analysis"
version = "1.0.0"
description = "Vietnamese Sentiment Analysis with UIT-VSMEC and Clean Architecture"
readme = "README.md"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unresolved imports, unused variables)
    "I",   # isort (standardized import sorting)
    "B",   # flake8-bugbear (catches common bugs, footguns, mutable default args)
    "T20", # flake8-print (BAN ALL PRINT STATEMENTS - Enforce structured logging)
    "ANN", # flake8-annotations (Enforce type hints on functions and methods)
    "ARG", # flake8-unused-arguments
]
ignore = [
    "ANN401", # Dynamically typed expressions (typing.Any) are allowed in abstract base classes
]

[tool.ruff.lint.per-file-ignores]
# Cho phép print và bỏ qua bắt buộc type annotation trong notebook, test suite, scripts và CLI runner
"notebooks/*" = ["T20", "ANN", "ARG"]
"tests/*" = ["T20", "ANN", "ARG"]
"scripts/*" = ["T20", "ANN"]
"source/services/cli/main.py" = ["T20", "ARG"]

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "underthesea.*",
    "sklearn.*",
    "seaborn.*",
    "wordcloud.*",
    "joblib.*",
    "scipy.*",
    "streamlit.*",
    "matplotlib.*"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "unit: Unit tests for pure logic and components",
    "data: Tests for data preprocessing and repository operations",
    "model: Tests for model training, tuning, and evaluation",
    "slow: Tests with extensive computational workloads",
]
log_file = "logs/test_execution.log"
log_file_level = "DEBUG"
log_file_format = "[%(asctime)s] [%(levelname)s] [%(name)s:%(lineno)d] - %(message)s"
log_file_date_format = "%Y-%m-%d %H:%M:%S"
