version: "3.8"

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: uit_vsmec_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - LOG_LEVEL=INFO
    volumes:
      - ../logs:/app/logs
    command: ["uvicorn", "source.api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  ui:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: uit_vsmec_ui
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_HEADLESS=true
    volumes:
      - ../logs:/app/logs
    command: ["streamlit", "run", "source/ui/app.py", "--server.port", "8501", "--server.headless", "true", "--server.address", "0.0.0.0"]
    depends_on:
      - api
