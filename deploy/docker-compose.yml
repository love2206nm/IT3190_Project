version: "3.8"

services:
  ui:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: uit_vsmec_ui
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - PORT=8501
    volumes:
      - ../logs:/app/logs

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: uit_vsmec_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    volumes:
      - ../logs:/app/logs
    command: ["python", "-m", "uvicorn", "source.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
