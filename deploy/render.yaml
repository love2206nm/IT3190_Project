# Render Infrastructure-as-Code Blueprint
# Deploy trực tiếp trên https://render.com
services:
  - type: web
    name: it3190-project
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free # 512 MB RAM, 0.1 CPU
    region: singapore
    envVars:
      - key: PORT
        value: 10000
      - key: LOG_LEVEL
        value: INFO
    healthCheckPath: /_stcore/health
